# Face Biometric Research Workbench — Configurable Model & Pipeline Registry (Milestones P1 & P1.1)
# Model paths are relative to the repository root. Never hardcode paths or thresholds in source code.

manifest_path: "models/manifests/model_manifest.json"

models:
  yunet_2023mar:
    model_name: "YuNet (OpenCV Zoo 2023-Mar)"
    model_version: "2023mar"
    model_path: "models/detection/face_detection_yunet_2023mar.onnx"
    model_type: "detection"
    runtime: "opencv_dnn"
    supported_runtimes: ["opencv_dnn", "onnxruntime"]
    input_dimensions: [1, 3, 640, 640]
    precision: "fp32"
    detection_params:
      score_threshold: 0.60
      nms_threshold: 0.30
      top_k: 5000
      resize_mode: "preserve_aspect_max_dim"   # "native" | "preserve_aspect_max_dim" | "fixed"
      max_input_dim: 1280
      fixed_input_size: [640, 640]             # [width, height] when resize_mode == "fixed"
    normalization:
      color_order: "BGR"
      scale: 1.0
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
    licensing_status:
      code_license: "MIT"
      weights_license: "MIT (opencv/opencv_zoo/models/face_detection_yunet/LICENSE; trained on WIDER FACE — MIT does not independently clear training-data rights)"
      training_dataset_provenance: "WIDER FACE"
      commercial_use_status: "conditional_requires_legal_dataset_review"
      production_eligible: false

  scrfd_500m_research:
    model_name: "SCRFD-500M (InsightFace Research Candidate)"
    model_version: "v0.0.1-500m"
    model_path: "models/detection/research_only/scrfd_500m.onnx"
    model_type: "detection"
    runtime: "onnxruntime"
    supported_runtimes: ["onnxruntime"]
    input_dimensions: [1, 3, 640, 640]
    precision: "fp32"
    normalization:
      color_order: "RGB"
      scale: 1.0
      mean: [127.5, 127.5, 127.5]
      std: [128.0, 128.0, 128.0]
    licensing_status:
      code_license: "MIT"
      weights_license: "InsightFace Non-Commercial Research Only"
      commercial_use_status: "non_commercial_research_only"
      production_eligible: false

  sface_2021dec:
    model_name: "SFace MobileFaceNet (OpenCV Zoo 2021-Dec)"
    model_version: "2021dec"
    model_path: "models/recognition/face_recognition_sface_2021dec.onnx"
    model_type: "recognition"
    runtime: "onnxruntime"
    supported_runtimes: ["onnxruntime", "opencv_dnn"]
    input_dimensions: [1, 3, 112, 112]
    embedding_dim: 128
    precision: "fp32"
    normalization:
      color_order: "BGR"
      scale: 1.0
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
      l2_normalize: true
    licensing_status:
      code_license: "Apache-2.0"
      weights_license: "Apache-2.0 (upstream training dataset caveat)"
      commercial_use_status: "conditional_requires_legal_dataset_review"
      production_eligible: false

  mobilefacenet_w600k_research:
    model_name: "MobileFaceNet W600K (InsightFace Research Candidate)"
    model_version: "buffalo_s-w600k"
    model_path: "models/recognition/research_only/mobilefacenet_w600k_mbf.onnx"
    model_type: "recognition"
    runtime: "onnxruntime"
    supported_runtimes: ["onnxruntime"]
    input_dimensions: [1, 3, 112, 112]
    embedding_dim: 512
    precision: "fp32"
    normalization:
      color_order: "RGB"
      scale: 1.0
      mean: [127.5, 127.5, 127.5]
      std: [127.5, 127.5, 127.5]
      l2_normalize: true
    licensing_status:
      code_license: "MIT"
      weights_license: "InsightFace Non-Commercial Research Only"
      commercial_use_status: "non_commercial_research_only"
      production_eligible: false

  reference_resnet50_baseline:
    model_name: "Reference External ResNet50 Baseline Slot"
    model_version: "user_supplied_slot"
    model_path: "models/recognition/reference_resnet50_baseline.onnx"
    pytorch_checkpoint_path: "models/recognition/reference_resnet50_baseline.pt"
    model_type: "recognition"
    runtime: "onnxruntime"
    supported_runtimes: ["onnxruntime", "pytorch"]
    device: "cuda"
    fallback_device: "cpu"
    batch_size: 8
    input_dimensions: [1, 3, 112, 112]
    embedding_dim: 512
    precision: "fp32"
    supported_precisions: ["fp32", "fp16"]
    normalization:
      # NOTE: Face recognition ResNet50 checkpoints commonly use [-1, 1] pixel scaling
      # rather than ImageNet [0.485, 0.456, 0.406] statistics. Confirm against the
      # training specification when supplying custom ResNet50 weights.
      color_order: "RGB"
      scale: 1.0
      mean: [127.5, 127.5, 127.5]
      std: [127.5, 127.5, 127.5]
      l2_normalize: true
    licensing_status:
      code_license: "User-Supplied / External"
      weights_license: "Pending Provenance Verification"
      commercial_use_status: "pending_internal_verification"
      production_eligible: false

  adaface_ir50_webface4m:
    model_name: "AdaFace IR-50 WebFace4M (Public Pretrained Baseline)"
    model_version: "cvpr2022-cvlface-60a65be"
    architecture: "ir_50"
    model_path: "models/recognition/public_resnet50/adaface_ir50_webface4m.onnx"
    onnx_fp16_path: "models/recognition/public_resnet50/adaface_ir50_webface4m_fp16.onnx"
    pytorch_checkpoint_path: "models/recognition/public_resnet50/adaface_ir50_webface4m.pt"
    model_type: "recognition"
    runtime: "onnxruntime"
    supported_runtimes: ["onnxruntime", "pytorch"]
    device: "cuda"
    fallback_device: "cpu"
    batch_size: 8
    input_dimensions: [1, 3, 112, 112]
    embedding_dim: 512
    precision: "fp32"
    supported_precisions: ["fp32", "fp16"]
    normalization:
      # Official minchul/cvlface_adaface_ir50_webface4m specification (model.yaml & v1_ir50.yaml):
      # color_space: 'RGB', ToTensor() + Normalize([0.5, 0.5, 0.5], [0.5, 0.5, 0.5]) -> [-1.0, 1.0]
      color_order: "RGB"
      scale: 1.0
      mean: [127.5, 127.5, 127.5]
      std: [127.5, 127.5, 127.5]
      l2_normalize: true
    licensing_status:
      code_license: "MIT"
      weights_license: "WebFace4M Non-Commercial Research Dataset Terms"
      commercial_use_status: "non_commercial_research_only"
      production_eligible: false

alignment:
  output_size: [112, 112]                      # [width, height]
  template_reference_size: [112, 112]
  landmark_order:
    - "right_eye_subject"                      # left side in image coordinates
    - "left_eye_subject"                       # right side in image coordinates
    - "nose_tip"
    - "right_mouth_subject"                    # left mouth corner in image coordinates
    - "left_mouth_subject"                     # right mouth corner in image coordinates
  canonical_5pt_112:
    - [38.2946, 51.6963]
    - [73.5318, 51.5014]
    - [56.0252, 71.7366]
    - [41.5493, 92.3655]
    - [70.7299, 92.2041]
  min_inter_ocular_px: 4.0
  border_mode: "constant"
  border_value: [0, 0, 0]

quality:
  warning_thresholds:
    min_face_width_px: 40.0
    min_face_height_px: 40.0
    min_relative_face_area: 0.002
    min_sharpness_laplacian_var: 35.0
    min_brightness_mean: 35.0
    max_brightness_mean: 225.0
    min_contrast_std: 18.0

pipeline:
  detector_model_key: "yunet_2023mar"
  recognizer_model_key: "adaface_ir50_webface4m"
  strict_recognition_artifact: false           # When false, returns explicit BLOCKED status (embedding=None) if configured recognizer weights are absent
  l2_normalize_embeddings: true
