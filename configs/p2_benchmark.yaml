# Face Biometric Research Workbench — Milestone P2 Comparative Benchmark Configuration
# Enforces all 5 mandatory rules from `docs/decisions/P2_benchmark_requirements.md` (`DISC-05`):
#   1. Uniform or explicitly per-profile-disclosed warmup & measured pass counts.
#   2. Zero `nvidia-smi` subprocess polling inside `wall_elapsed_s` or per-iteration timers.
#   3. Every profile JSON records `warmup_count`, `measured_pass_count`, `synchronization_method`, `timing_boundaries`.
#   4. Out-of-band GPU telemetry sampled strictly outside measured intervals.
#   5. Dual reporting of raw model inference latency and end-to-end pipeline latency.

p2_benchmarks:
  seed: 42
  models_config: "configs/p2_models.yaml"
  frozen_p11_models_config: "configs/models.yaml"

  detection:
    p1_ground_truth_manifest: "datasets/manifests/detection_ground_truth.json"
    extended_ground_truth_manifest: "datasets/manifests/p11_detection_small_face_gt.json"
    iou_match_threshold: 0.50
    warmup_iterations: 10
    measurement_iterations: 30
    output_json: "reports/p2_detection_comparison.json"

  recognition:
    nasa_verification_manifest: "datasets/manifests/p11_verification_pairs.json"
    lfw_pairs_path: "datasets/evaluation/lfw_research_only/pairs.txt"
    warmup_iterations: 20
    measurement_iterations: 60
    batch_sizes: [1, 4, 8, 16]
    far_targets: [0.001, 0.01, 0.05, 0.10]
    output_json: "reports/p2_recognition_comparison.json"

  pipeline:
    p1_ground_truth_manifest: "datasets/manifests/detection_ground_truth.json"
    extended_ground_truth_manifest: "datasets/manifests/p11_detection_small_face_gt.json"
    warmup_passes: 5
    measurement_passes: 15
    fixed_batch_size: 8
    output_json: "reports/p2_pipeline_comparison.json"
