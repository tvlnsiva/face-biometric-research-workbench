# Face Biometric Research Workbench — Milestone P2 Comparative Evaluation Registry
# NOTE: Independent P2 configuration. Preserves `configs/models.yaml` (Milestone P1.1 baseline) untouched.

manifest_path: "models/manifests/model_manifest.json"

models:
  # ---------------------------------------------------------------------------
  # Detection Candidates (Workstream A)
  # ---------------------------------------------------------------------------
  yunet_2023mar:
    model_name: "YuNet (OpenCV Zoo 2023-Mar — P1.1 Frozen Baseline)"
    model_version: "2023mar"
    architecture: "YuNet (Lightweight Multi-Stride CNN, 53,121 params)"
    model_path: "models/detection/face_detection_yunet_2023mar.onnx"
    model_type: "detection"
    runtime: "opencv_dnn"
    supported_runtimes: ["opencv_dnn"]
    supported_devices: ["cpu"]
    input_dimensions: [1, 3, 640, 640]
    precision: "fp32"
    supported_precisions: ["fp32"]
    detection_params:
      score_threshold: 0.60
      nms_threshold: 0.30
      top_k: 5000
      resize_mode: "preserve_aspect_max_dim"
      max_input_dim: 1280
      fixed_input_size: [640, 640]
    normalization:
      color_order: "BGR"
      scale: 1.0
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
    licensing_status:
      code_license: "MIT"
      weights_license: "MIT (opencv/opencv_zoo/models/face_detection_yunet/LICENSE; trained on WIDER FACE — MIT does not independently clear training-data rights)"
      training_dataset_provenance: "WIDER FACE"
      commercial_use_status: "conditional_requires_legal_dataset_review"
      governance_classification: "PENDING_LEGAL_REVIEW"
      production_eligible: false

  scrfd_500m_research:
    model_name: "SCRFD-500M-KPS (InsightFace Buffalo_SC Research Candidate)"
    model_version: "v0.0.1-det_500m"
    architecture: "SCRFD-500M-BNKPS (3-stride [8,16,32] 2-anchor FPN + 5-pt landmarks, 626,332 params)"
    model_path: "models/detection/research_only/scrfd_500m.onnx"
    model_type: "detection"
    runtime: "onnxruntime"
    supported_runtimes: ["onnxruntime"]
    device: "cuda"
    fallback_device: "cpu"
    supported_devices: ["cpu", "cuda"]
    input_dimensions: [1, 3, 1280, 1280]
    precision: "fp32"
    supported_precisions: ["fp32"]
    detection_params:
      # Upstream InsightFace scrfd.py defaults: det_thresh=0.50, nms_thresh=0.40
      score_threshold: 0.50
      nms_threshold: 0.40
      top_k: 5000
      input_size: [1280, 1280]
      allow_upscale: false
    normalization:
      # Verified in deepinsight/insightface/python-package/insightface/model_zoo/scrfd.py:
      # swapRB=True (RGB), input_mean=127.5, input_std=128.0 -> (rgb - 127.5) / 128.0
      color_order: "RGB"
      scale: 1.0
      mean: [127.5, 127.5, 127.5]
      std: [128.0, 128.0, 128.0]
    licensing_status:
      code_license: "MIT (deepinsight/insightface)"
      weights_license: "InsightFace Non-Commercial Research Only"
      training_dataset_provenance: "WIDER FACE + InsightFace 5-point landmark annotations (non-commercial research restriction)"
      commercial_use_status: "non_commercial_research_only"
      governance_classification: "RESEARCH_ONLY"
      production_eligible: false

  # ---------------------------------------------------------------------------
  # Recognition Candidates (Workstream B)
  # ---------------------------------------------------------------------------
  adaface_ir50_webface4m:
    model_name: "AdaFace IR-50 WebFace4M (P1.1 Frozen Baseline)"
    model_version: "cvpr2022-cvlface-60a65be"
    architecture: "ir_50"
    model_path: "models/recognition/public_resnet50/adaface_ir50_webface4m.onnx"
    onnx_fp16_path: "models/recognition/public_resnet50/adaface_ir50_webface4m_fp16.onnx"
    pytorch_checkpoint_path: "models/recognition/public_resnet50/adaface_ir50_webface4m.pt"
    model_type: "recognition"
    runtime: "onnxruntime"
    supported_runtimes: ["onnxruntime", "pytorch"]
    device: "cuda"
    fallback_device: "cpu"
    batch_size: 8
    dynamic_batch_supported: true
    input_dimensions: [1, 3, 112, 112]
    embedding_dim: 512
    precision: "fp32"
    supported_precisions: ["fp32", "fp16"]
    normalization:
      # Verified in minchul/cvlface_adaface_ir50_webface4m/models/iresnet/configs/v1_ir50.yaml:
      # color_space: 'RGB', ToTensor() + Normalize([0.5]*3, [0.5]*3) -> (rgb - 127.5) / 127.5
      color_order: "RGB"
      scale: 1.0
      mean: [127.5, 127.5, 127.5]
      std: [127.5, 127.5, 127.5]
      l2_normalize: true
    licensing_status:
      code_license: "MIT (mk-minchul/AdaFace & CVLface)"
      weights_license: "WebFace4M / WebFace260M Non-Commercial Research Dataset Terms"
      training_dataset_provenance: "WebFace4M (4.2M images, 205,990 IDs)"
      commercial_use_status: "non_commercial_research_only"
      governance_classification: "RESEARCH_ONLY"
      production_eligible: false

  sface_2021dec:
    model_name: "SFace MobileFaceNet (OpenCV Zoo 2021-Dec Candidate)"
    model_version: "2021dec"
    architecture: "sface_mobilefacenet_128d"
    model_path: "models/recognition/face_recognition_sface_2021dec.onnx"
    model_type: "recognition"
    runtime: "onnxruntime"
    supported_runtimes: ["onnxruntime", "opencv_dnn"]
    device: "cuda"
    fallback_device: "cpu"
    batch_size: 1
    dynamic_batch_supported: false   # MXNet-exported ONNX graph fixes input `data` to static [1, 3, 112, 112]
    input_dimensions: [1, 3, 112, 112]
    embedding_dim: 128
    precision: "fp32"
    supported_precisions: ["fp32"]   # Upstream distributes FP32 ONNX (and int8bq) only; no FP16 ONNX or .pt
    normalization:
      # Verified empirically against cv2.FaceRecognizerSF.feature() (cosine=1.0000000, max_diff=3.46e-6)
      # and by inspecting ONNX graph nodes `_minusscalar0` + `_mulscalar0`:
      # OpenCV FaceRecognizerSF swaps BGR->RGB (`swapRB=True`) and passes raw float32 [0, 255]
      # because `(x - 127.5) / 128.0` is baked inside the ONNX graph's first two scalar nodes!
      color_order: "RGB"
      scale: 1.0
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
      l2_normalize: true
    licensing_status:
      code_license: "Apache-2.0 (opencv/opencv_zoo/models/face_recognition_sface/LICENSE)"
      weights_license: "Apache-2.0 in OpenCV Zoo; upstream zhongyy/SFace trained on MS-Celeb-1M / CASIA-WebFace / VGGFace2"
      training_dataset_provenance: "MS-Celeb-1M / CASIA-WebFace / VGGFace2 (academic non-commercial datasets; Apache-2.0 wrapper license does not independently clear training-data rights)"
      commercial_use_status: "conditional_requires_legal_dataset_review"
      governance_classification: "PENDING_LEGAL_REVIEW"
      production_eligible: false

  mobilefacenet_w600k_research:
    model_name: "MobileFaceNet W600K (InsightFace Buffalo_S Candidate)"
    model_version: "buffalo_s-w600k_mbf"
    architecture: "mobilefacenet_512d"
    model_path: "models/recognition/research_only/mobilefacenet_w600k_mbf.onnx"
    model_type: "recognition"
    runtime: "onnxruntime"
    supported_runtimes: ["onnxruntime"]
    device: "cuda"
    fallback_device: "cpu"
    batch_size: 8
    dynamic_batch_supported: true    # ONNX input `input.1` has dynamic batch ['None', 3, 112, 112]
    input_dimensions: [1, 3, 112, 112]
    embedding_dim: 512
    precision: "fp32"
    supported_precisions: ["fp32"]   # Upstream distributes FP32 ONNX only; no public .pt or FP16 ONNX
    normalization:
      # Verified in deepinsight/insightface/python-package/insightface/model_zoo/arcface_onnx.py:
      # First ONNX node is Conv_0 (no internal Sub/Mul), swapRB=True (RGB), mean=127.5, std=127.5 -> [-1, 1]
      color_order: "RGB"
      scale: 1.0
      mean: [127.5, 127.5, 127.5]
      std: [127.5, 127.5, 127.5]
      l2_normalize: true
    licensing_status:
      code_license: "MIT (deepinsight/insightface)"
      weights_license: "InsightFace Non-Commercial Research Only"
      training_dataset_provenance: "WebFace600K (subset of WebFace260M — non-commercial research restriction)"
      commercial_use_status: "non_commercial_research_only"
      governance_classification: "RESEARCH_ONLY"
      production_eligible: false

alignment:
  output_size: [112, 112]
  template_reference_size: [112, 112]
  landmark_order:
    - "right_eye_subject"
    - "left_eye_subject"
    - "nose_tip"
    - "right_mouth_subject"
    - "left_mouth_subject"
  canonical_5pt_112:
    - [38.2946, 51.6963]
    - [73.5318, 51.5014]
    - [56.0252, 71.7366]
    - [41.5493, 92.3655]
    - [70.7299, 92.2041]
  min_inter_ocular_px: 4.0
  border_mode: "constant"
  border_value: [0, 0, 0]

quality:
  warning_thresholds:
    min_face_width_px: 40.0
    min_face_height_px: 40.0
    min_relative_face_area: 0.002
    min_sharpness_laplacian_var: 35.0
    min_brightness_mean: 35.0
    max_brightness_mean: 225.0
    min_contrast_std: 18.0

pipeline:
  detector_model_key: "yunet_2023mar"
  recognizer_model_key: "adaface_ir50_webface4m"
  strict_recognition_artifact: true
  l2_normalize_embeddings: true
