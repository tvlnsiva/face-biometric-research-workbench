name: face-biometric-research-workbench
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11.9
  - pip
  # Primary reproducible installation uses the isolated .venv with pinned pip requirements:
  #   GPU workstation: pip install -r requirements/gpu.txt -r requirements/dev.txt
  #   CPU fallback:    pip install -r requirements/base.txt -r requirements/dev.txt
  - pip:
      - -r requirements/gpu.txt
      - -r requirements/dev.txt
